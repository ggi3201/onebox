name: Deploy site

# The site (site/) is on Cloudflare Pages. It builds from the guides and from
# every SKILL.md, so a change to either must go live. On a PR this only builds.
# On a merge to main it also deploys, but only when both repository secrets
# exist. Without them it builds and says so, and does not fail.
on:
  pull_request:
    paths:
      - "site/**"
      - "guides/**"
      - "plugins/**/SKILL.md"
      - "plugins/start/skills/plan/references/catalog.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/deploy-site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "guides/**"
      - "plugins/**/SKILL.md"
      - "plugins/start/skills/plan/references/catalog.json"
      - ".claude-plugin/marketplace.json"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: site/.node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: Check the build has what skills fetch
        working-directory: site
        run: |
          for f in dist/index.html dist/llms.txt dist/_headers dist/guides/xcode.md dist/guides/xcode/index.html; do
            test -s "$f" || { echo "missing: $f"; exit 1; }
          done
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request'
        working-directory: site
        # The secrets are only in this step, so `npm ci` scripts never see them.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Not deployed. Add the repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (site/DEPLOY.md)."
            exit 0
          fi
          # A pasted secret often has a trailing line break, a space or quotes.
          # Remove them, and print the lengths (never the values) to help debug.
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d "[:space:]\"'" | sed 's/^Bearer//')"
          account="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d "[:space:]\"'")"
          echo "token length: ${#token}, account id length: ${#account} (an account id has 32)"
          export CLOUDFLARE_API_TOKEN="$token" CLOUDFLARE_ACCOUNT_ID="$account"
          npx --yes wrangler@4 pages deploy dist --project-name onebox --branch main --commit-dirty=true
