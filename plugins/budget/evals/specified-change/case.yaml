schema_version: "1.0"
name: specified-change
description: A clear change with a pattern to copy. Should go to a sonnet general-purpose agent. (No Bash in evals on this machine, so tests are checked by reading.)
tags: [routing, should-fire, writes]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Delegate this to a cheaper model to save tokens: add an optional `status` filter to listOrders in src/orders/list.ts, written exactly like the existing `region` filter. Add a test for it in test/orders.test.mjs next to the region test. You cannot run commands here, so do not try to run the tests."
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Skill, Agent, Read, Glob, Grep, Edit, Write]
runs: 3
graders:
  - type: tool_used
    name: routed-to-sonnet
    tool: Agent
    input_match: '"model":\s*"sonnet"'
  - type: tool_used
    name: no-expensive-agent
    tool: Agent
    input_match: '"model":\s*"(opus|fable)"'
    min: 0
    max: 0
    arm: both
  - type: regex
    name: filter-added
    target: files
    pattern: "filters\\.status"
  - type: regex
    name: test-added
    target: files
    pattern: 'status: "(open|shipped|cancelled)"'
  - type: llm
    name: correct-change-and-report
    focus: trace
    criteria: |
      1. src/orders/list.ts gained an optional `status` filter that mirrors the `region` filter
         (`if (filters.status) out = out.filter((o) => o.status === filters.status);` or equivalent),
         and the filters type includes `status?`.
      2. test/orders.test.mjs gained a test that uses the status filter and asserts the right ids.
      3. The final message includes a line like "Delegated: <what> -> <agent type>/<model>".
      All three must hold.
