schema_version: "1.0"
name: find-unknown-file
description: Search across files for an unknown location. Should go to a cheap Explore agent.
tags: [routing, should-fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Save tokens where you can and use a cheaper model for the digging. Where is rate limiting enforced for the search endpoint? Give file:line for the check and for the limit function."
  max_turns: 15
  timeout_seconds: 400
  allowed_tools: [Skill, Agent, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: "delegate"
  - type: tool_used
    name: routed-to-haiku
    tool: Agent
    input_match: '"model":\s*"haiku"'
  - type: tool_used
    name: no-expensive-agent
    tool: Agent
    input_match: '"model":\s*"(opus|fable)"'
    min: 0
    max: 0
    arm: both
  - type: regex
    name: names-throttle-file
    pattern: "throttle\\.ts"
  - type: regex
    name: names-search-route
    pattern: "search\\.ts:\\d+"
  - type: llm
    name: correct-answer
    criteria: |
      The answer says the check is in src/routes/search.ts (the `limitRequests(...)` call, around line 6)
      and the limit function is `limitRequests` in src/middleware/throttle.ts (around line 3).
      It gives file:line references. Line numbers within ±2 are fine.
