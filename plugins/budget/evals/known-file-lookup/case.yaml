schema_version: "1.0"
name: known-file-lookup
description: One read of a known file. Delegating here wastes tokens, so no Agent call.
tags: [routing, should-not-fire]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: "Save tokens where you can. What is MAX_UPLOAD_MB set to in src/config.ts?"
  max_turns: 8
  timeout_seconds: 240
  allowed_tools: [Skill, Agent, Read, Glob, Grep]
runs: 3
graders:
  - type: tool_used
    name: no-agent
    tool: Agent
    min: 0
    max: 0
    arm: both
  - type: regex
    name: says-25
    pattern: "\\b25\\b"
